services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    init: true
    restart: 'no'
    shm_size: 1gb
    mem_limit: 3g
    cpus: 2
    env_file: worker/.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-worker.json
      ARTIFACT_DIR: /app/worker/artifacts
    volumes:
      - ./secrets/firebase-worker.json:/run/secrets/firebase-worker.json:ro
      - worker-artifacts:/app/worker/artifacts
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  worker-artifacts:
